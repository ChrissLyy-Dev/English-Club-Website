<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Writing Materials</title>
  <link rel="stylesheet" href="../test.css">
  <script>
    (function () {
      var stored = localStorage.getItem("theme");
      var prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
      document.documentElement.setAttribute("data-theme", stored || (prefersDark ? "dark" : "light"));
    })();
  </script>
</head>
<body>
  <a class="skip-link" href="#content">Skip to content</a>
  <header class="site-header">
    <h1>Writing</h1>
    <p>Further writing materials and practice.</p>
    <button id="theme-toggle" class="theme-toggle" type="button" aria-pressed="false" aria-label="Switch to dark mode">
      <span class="theme-toggle-icon" aria-hidden="true">🌙</span>
    </button>
  </header>

  <main id="content" class="gallery-container">
    <p><a href="../index.html">&larr; Back to gallery</a></p>

    <section id="level-select">
      <h2 id="level-heading">Choose your level</h2>
      <div id="level-tabs" class="level-tabs" role="tablist" aria-label="English level"></div>
    </section>

    <section id="prompt-section">
      <h2 id="prompt-title"></h2>
      <p id="prompt-instructions" class="passage-text"></p>

      <p class="checklist-heading">Try to include:</p>
      <ul id="checklist" class="checklist"></ul>

      <label for="writing-area" class="writing-label">Your writing</label>
      <textarea id="writing-area" class="writing-textarea" rows="10" placeholder="Start writing here… your draft is saved automatically in this browser."></textarea>

      <div class="writing-controls">
        <p id="word-count" class="word-count"></p>
        <button id="writing-clear" type="button">Clear draft</button>
      </div>
      <p id="writing-feedback" class="feedback" aria-live="polite"></p>
    </section>
  </main>

  <footer>
    SMA Negeri 1 Sungailiat
  </footer>

  <script src="../test.js"></script>
  <script src="writing.js"></script>
</body>
</html>
