<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reading Materials</title>
  <link rel="stylesheet" href="../test.css">
  <script>
    (function () {
      var stored = localStorage.getItem("theme");
      var prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
      document.documentElement.setAttribute("data-theme", stored || (prefersDark ? "dark" : "light"));
    })();
  </script>
</head>
<body>
  <a class="skip-link" href="#content">Skip to content</a>
  <header class="site-header">
    <h1>Reading</h1>
    <p>Further reading materials and practice.</p>
    <button id="theme-toggle" class="theme-toggle" type="button" aria-pressed="false" aria-label="Switch to dark mode">
      <span class="theme-toggle-icon" aria-hidden="true">🌙</span>
    </button>
  </header>

  <main id="content" class="gallery-container">
    <p><a href="../test.html">&larr; Back to gallery</a></p>

    <section id="level-select">
      <h2 id="level-heading">Choose your level</h2>
      <div id="level-tabs" class="level-tabs" role="tablist" aria-label="English level"></div>
    </section>

    <section id="word-arrange-section">
      <h2>Word Arrange</h2>
      <p>Click the words in the correct order to build the sentence.</p>
      <p id="word-progress" class="word-progress"></p>
      <div id="word-answer" class="word-answer" aria-label="Your sentence"></div>
      <div id="word-bank" class="word-bank" aria-label="Available words"></div>
      <div class="word-arrange-controls">
        <button id="word-check" type="button">Check</button>
        <button id="word-reset" type="button">Reset</button>
        <button id="word-next" type="button">Next sentence</button>
      </div>
      <p id="word-feedback" class="feedback" aria-live="polite"></p>
    </section>

    <section id="passage-section">
      <h2 id="passage-title"></h2>
      <p id="passage-text" class="passage-text"></p>
      <div id="questions-container"></div>
    </section>
  </main>

  <footer>
    Accessible JavaScript Photo Gallery Final Project
  </footer>

  <script src="../test.js"></script>
  <script src="reading.js"></script>
</body>
</html>
