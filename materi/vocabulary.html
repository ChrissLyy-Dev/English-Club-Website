<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vocabulary Materials</title>
  <link rel="stylesheet" href="../test.css">
  <script>
    (function () {
      var stored = localStorage.getItem("theme");
      var prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
      document.documentElement.setAttribute("data-theme", stored || (prefersDark ? "dark" : "light"));
    })();
  </script>
</head>
<body>
  <a class="skip-link" href="#content">Skip to content</a>
  <header class="site-header">
    <h1>Vocabulary</h1>
    <p>Learn 350+ useful English words by topic, then test yourself.</p>
    <button id="theme-toggle" class="theme-toggle" type="button" aria-pressed="false" aria-label="Switch to dark mode">
      <span class="theme-toggle-icon" aria-hidden="true">🌙</span>
    </button>
  </header>

  <main id="content" class="gallery-container">
    <p><a href="../index.html">&larr; Back to gallery</a></p>

    <section id="topic-select">
      <h2 id="topic-heading">Choose a topic</h2>
      <div id="topic-tabs" class="level-tabs" role="tablist" aria-label="Vocabulary topic"></div>
    </section>

    <section id="word-list-section">
      <h2>Word List</h2>
      <div class="vocab-toolbar">
        <label class="writing-label" for="vocab-search">Search a word or its meaning</label>
        <input id="vocab-search" class="vocab-search" type="search" placeholder="e.g. weather, lapar, give up" autocomplete="off">
        <p id="vocab-count" class="word-count" aria-live="polite"></p>
      </div>
      <div id="vocab-grid" class="vocab-grid"></div>
    </section>

    <section id="practice-section">
      <h2>Practice</h2>
      <div class="word-arrange-controls">
        <button id="new-quiz" type="button">New quiz</button>
      </div>
      <div id="questions-container"></div>
    </section>
  </main>

  <footer>
    SMA Negeri 1 Sungailiat
  </footer>

  <script src="../test.js"></script>
  <script src="vocabulary.js"></script>
</body>
</html>
